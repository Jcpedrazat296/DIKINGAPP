<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di-King | Acceso Administrativo</title>
    <link rel="stylesheet" href="style-login.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .error-box {
            display: none;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #ff4d4d;
        }
        /* Estilos para el botón de crear administrador y la ventana modal */
        .btn-crear-admin {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            display: none; /* Se oculta por defecto, solo se muestra a admins logueados */
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">Di-King <span>Admin</span></div>
            <h2>CONTROL DE ACCESO</h2>
            <p class="subtitle">Identifíquese para gestionar el parqueadero</p>

            <div id="error-auth" class="error-box"></div>

            <form id="admin-login-form">
                <div class="input-group">
                    <label>Correo Administrativo</label>
                    <input type="email" id="user" placeholder="admin@diking.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">ENTRAR AL SISTEMA</button>
            </form>

            <button id="btn-abrir-registro-admin" class="btn-crear-admin" onclick="abrirModal()">+ CREAR NUEVO ADMINISTRADOR</button>
            
            <a href="index.html" class="back-link" style="display: block; text-align: center; margin-top: 15px;">Volver al sitio público</a>
        </div>
    </div>

    <div id="modal-admin" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h3 style="color:#5d2a7a; margin-bottom:15px;">Registrar Administrador</h3>
            <form id="register-admin-form">
                <div class="input-group">
                    <label>Nombre del Colaborador</label>
                    <input type="text" id="adm-name" required>
                </div>
                <div class="input-group">
                    <label>Correo Electrónico Corporativo</label>
                    <input type="email" id="adm-email" required>
                </div>
                <div class="input-group">
                    <label>Contraseña Asignada</label>
                    <input type="password" id="adm-pass" required>
                </div>
                <button type="submit" class="login-btn" style="background-color:#28a745;">GUARDAR EN MYSQL</button>
            </form>
        </div>
    </div>

    <script>
        const API_ADMIN_IP = '172.20.10.4';
        const LOGIN_API_URL = `http://${API_ADMIN_IP}:3000/api/usuarios/login`;
        const REGISTRO_API_URL = `http://${API_ADMIN_IP}:3000/api/usuarios/registro`;

        // COMPROBACIÓN DE PRIVILEGIOS AL CARGAR LA PÁGINA
        window.onload = function() {
            const sesion = JSON.parse(sessionStorage.getItem('usuario_logeado'));
            // Si el que está sentado ya es Admin, le habilitamos el botón para crear otros admins
            if (sesion && sesion.tipo === 'Admin') {
                document.getElementById('btn-abrir-registro-admin').style.display = 'block';
            }
        }

        // CONTROL DE VENTANA MODAL
        function abrirModal() { document.getElementById('modal-admin').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal-admin').style.display = 'none'; }

        // 1. LOGIC DE LOGIN (CON USUARIO GENÉRICO INICIAL DE EMERGENCIA)
        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const correo = document.getElementById('user').value.trim();
            const contrasena = document.getElementById('pass').value;
            const errorElement = document.getElementById('error-auth');

            errorElement.style.display = "none";

            // CASO ESPECIAL: Usuario genérico de respaldo por si la base de datos está vacía al inicio
            if (correo === "admin@diking.com" && contrasena === "Admin123*") {
                const usuarioGenerico = { nombre: "Genérico", correo: "admin@diking.com", tipo: "Admin" };
                sessionStorage.setItem("usuario_logeado", JSON.stringify(usuarioGenerico));
                sessionStorage.setItem("acceso_concedido", "true");
                alert("Ingresando con usuario genérico de respaldo.");
                window.location.href = "gestion.html";
                return;
            }

            // CONSULTA NORMAL AL SERVIDOR DE NODEJS + MYSQL
            try {
                const respuesta = await fetch(LOGIN_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    if (resultado.usuario.tipo === 'Admin') {
                        sessionStorage.setItem("usuario_logeado", JSON.stringify(resultado.usuario));
                        sessionStorage.setItem("acceso_concedido", "true");
                        alert(`Bienvenido, Administrador ${resultado.usuario.nombre}.`);
                        window.location.href = "gestion.html";
                    } else {
                        errorElement.innerText = "Acceso denegado. No tienes permisos de administración.";
                        errorElement.style.display = "block";
                    }
                } else {
                    errorElement.innerText = resultado.error || "Credenciales incorrectas.";
                    errorElement.style.display = "block";
                }
            } catch (error) {
                errorElement.innerText = "Sin conexión con el servidor.";
                errorElement.style.display = "block";
            }
        });

        // 2. LÓGICA PARA CREAR UN NUEVO ADMINISTRADOR EN LA DB
        document.getElementById('register-admin-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nombre = document.getElementById('adm-name').value.trim();
            const correo = document.getElementById('adm-email').value.trim();
            const contrasena = document.getElementById('adm-pass').value;

            try {
                // Reutilizamos el endpoint de registro mandando la información
                const respuesta = await fetch(REGISTRO_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo, contrasena })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    // ¡OJO AQUÍ!: Como lo creó un Administrador, debemos hacer un truco rápido. 
                    // El endpoint de registro por defecto crea "Clientes". 
                    // Debes ir a tu MySQL y cambiar el 'tipo_usuario' de este nuevo correo a 'Admin' 
                    // O agregar un campo tipo en el backend.
                    alert(`¡Administrador ${nombre} registrado con éxito en MySQL! Recuerda asignarle rol Admin en la BD.`);
                    cerrarModal();
                    document.getElementById('register-admin-form').reset();
                } else {
                    alert(`Error: ${resultado.error}`);
                }
            } catch (error) {
                alert("Error de red al intentar registrar.");
            }
        });
    </script>
</body>
</html>
